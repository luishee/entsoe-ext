[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "entsoe-ext"
version = "0.2.0"
description = "Self-contained ENTSO-E Transparency Platform client: raw XML channels plus parsed Series/DataFrame methods, replicating entsoe-py 0.8.1 semantics with no entsoe-py runtime dependency."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "luishee" }]
keywords = [
  "entsoe",
  "transparency-platform",
  "energy",
  "net-position",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  # The HTTP layer uses requests; parsing is bs4 (html.parser) + pandas.
  # entsoe-py is intentionally NOT a dependency (semantics are replicated).
  "requests>=2.28",
  "beautifulsoup4>=4.11",
  "pandas>=1.5",
]

[project.optional-dependencies]
test = []

[project.urls]
Homepage = "https://github.com/luishee/entsoe-ext"
Source = "https://github.com/luishee/entsoe-ext"

[tool.setuptools.packages.find]
where = ["src"]