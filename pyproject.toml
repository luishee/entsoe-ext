[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "entsoe-ext"
version = "0.1.0"
description = "Opt-in fixes and explicit wrappers around entsoe-py 0.8.0 (unknown resolution, per_hour aggregation, net-position parsing, single client entry point)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "luishee" }]
keywords = [
  "entsoe",
  "entsoe-py",
  "transparency-platform",
  "energy",
  "net-position",
]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  # Pinned: this package intentionally wraps a couple of entsoe-py *private*
  # helpers (`entsoe.series_parsers._extract_timeseries` /
  # `_parse_timeseries_generic`) and patches its internals, so it is only
  # validated against this exact version (see ``install()`` version guard).
  "entsoe-py==0.8.0",
  "pandas>=1.5",
]

[project.optional-dependencies]
test = []

[project.urls]
Homepage = "https://github.com/luishee/entsoe-ext"
Source = "https://github.com/luishee/entsoe-ext"

[tool.setuptools.packages.find]
where = ["src"]